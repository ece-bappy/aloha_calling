<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ALOHA!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* Modal Styles */
        #passwordModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .modal-content input {
            width: 80%;
            padding: 10px;
            margin-top: 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .modal-content button {
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .modal-content button:hover {
            background-color: #218838;
        }

        /* Slide container */
        .slide-container {
            display: none;
            width: 960px;
            height: 569px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Password Modal -->
    <div id="passwordModal">
        <div class="modal-content">
            <h2>Enter OTP</h2>
            <input type="password" id="passwordInput" placeholder="Enter Password" />
            <button onclick="checkPassword()">Submit</button>
        </div>
    </div>

    <!-- Slide Container -->
    <div class="slide-container" id="slideContainer">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vR8hYwbNfNedTnoyPS1cI4f8jwgPakR6pt0M6NJpVHQnDz9pjmdL6pl32q_CqtHBGtqzec4hGQXRPxk/embed?start=false&loop=false&delayms=3000" 
                frameborder="0" width="960" height="569" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true">
        </iframe>
    </div>

    <script>
        function checkPassword() {
            const password = document.getElementById("passwordInput").value;
            if (password === "1212") {
                document.getElementById("passwordModal").style.display = "none";
                document.getElementById("slideContainer").style.display = "block";
            } else {
                alert("Incorrect password, please try again.");
            }
        }
    </script>

</body>
</html>
